<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巡检小车诊断记录</title>
<style>
  :root{color-scheme:light;font:16px/1.55 "Microsoft YaHei UI",system-ui,sans-serif;background:#f4f6f8;color:#172335}
  *{box-sizing:border-box}
  main{max-width:880px;margin:44px auto;padding:0 20px 32px}
  h1{font-size:clamp(24px,4vw,36px);margin:0 0 8px}
  h2{font-size:17px;margin:0 0 10px}
  p{margin:0 0 10px}
  .actions,.grid{display:grid;gap:12px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:18px 0}
  .actions{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:18px}
  article,form,.storage{background:white;border:1px solid #dbe2ea;border-radius:12px;padding:16px}
  .storage{margin:18px 0}
  .buttons,.input{display:flex;flex-wrap:wrap;gap:8px}
  input,button,a.button{font:inherit;border-radius:7px;padding:7px 12px}
  input{border:1px solid #a5b4c5;min-width:155px;flex:1}
  button,a.button{border:1px solid #245eaa;background:#245eaa;color:white;text-decoration:none;cursor:pointer}
  a.button.secondary{background:white;color:#245eaa}
  .hint,small{color:#4f6074}
  strong{display:block}
  [data-bad=true]{color:#a12c29}
  code{overflow-wrap:anywhere}
</style>
<main>
  <h1>巡检小车诊断记录</h1>
  <p id="recorder" role="status">正在连接本机记录器…</p>
  <div class="buttons">
    <a class="button" href="/gimbal-3d-scan.html" target="_blank" rel="noopener">打开 3D 扫描</a>
    <a class="button secondary" href="/gimbal-radar-standalone.html" target="_blank" rel="noopener">打开 2D 扫描</a>
  </div>
  <div class="grid">
    <article><h2>基座与遥控</h2><strong id="base">等待采样</strong><small id="baseDetail"></small></article>
    <article><h2>摄像头</h2><strong id="camera">等待采样</strong><small id="cameraDetail"></small></article>
    <article><h2>网页图传</h2><strong id="video">等待开启画面</strong><small id="videoDetail"></small></article>
  </div>
  <div class="storage"><h2>当前日志文件</h2><code id="file">等待写入</code></div>
  <div class="actions">
    <form id="cameraForm">
      <h2><label for="cameraHost">摄像头地址</label></h2>
      <div class="input"><input id="cameraHost" maxlength="100" placeholder="rover-camera.local"><button>保存</button></div>
      <small id="cameraNote">从本页打开扫描界面并开启图传时，记录器会自动采用该地址。</small>
    </form>
    <form id="markForm">
      <h2><label for="mark">故障标记（可选）</label></h2>
      <div class="input"><input id="mark" maxlength="120" placeholder="出现卡顿"><button>标记此刻</button></div>
      <small id="markNote" role="status">可标注测试动作或故障时刻。</small>
    </form>
  </div>
</main>
<script>
  const byId = id => document.getElementById(id);
  let lastCameraHost;
  function status(id, label, detail, bad = false) {
    byId(id).textContent = label;
    byId(id).dataset.bad = bad;
    byId(id + 'Detail').textContent = detail;
  }
  async function refresh() {
    try {
      const response = await fetch('/api/status', {cache:'no-store', signal:AbortSignal.timeout(1500)});
      if (!response.ok) throw new Error('状态请求失败');
      const {latest, file, error, cameraHost} = await response.json();
      const base = latest.base;
      const camera = latest.camera;
      const video = latest.video;
      byId('recorder').textContent = error ? '日志写入失败：' + error : '正在自动记录 · 可以关闭此网页';
      byId('recorder').dataset.bad = Boolean(error);
      byId('file').textContent = file || '等待写入';
      if (cameraHost !== lastCameraHost && document.activeElement !== byId('cameraHost')) {
        byId('cameraHost').value = cameraHost;
        lastCameraHost = cameraHost;
      }
      if (base) {
        const label = !base.ok ? '基座未连通' : !base.online ? '基座在线 · 主控无数据' :
          base.handheldUdpOnline === false ? '主控在线 · 未收到手持指令' : '主控在线';
        const detail = base.ok ? '请求 ' + base.requestMs + ' ms' : '请连接小车的 GimbalCtrl Wi-Fi';
        status('base', label, detail, !base.ok || !base.online);
      }
      if (!cameraHost) status('camera', '状态采样已停用', '可填写地址重新开启');
      else if (!camera) status('camera', '等待采样', cameraHost);
      else {
        const label = !camera.ok ? '摄像头未连通' : camera.cameraReady ? '摄像头在线' : '摄像头未就绪';
        const detail = camera.ok ? '信号 ' + (camera.rssi ?? '—') + ' dBm' : cameraHost;
        status('camera', label, detail, !camera.ok || !camera.cameraReady);
      }
      if (video) {
        const label = {start:'正在连接', frame:'正在收图', error:'收图失败', stale:'画面过期', stop:'画面已关闭'};
        const time = new Date(video.time).toLocaleTimeString('zh-CN', {hour12:false});
        const detail = video.fetchMs === undefined ? video.reason || '' : '最近收图 ' + video.fetchMs + ' ms';
        const expired = video.event === 'frame' && Date.now() - new Date(video.time).getTime() > 6000;
        status('video', expired ? '暂无新记录' : label[video.event], [detail, time].filter(Boolean).join(' · '),
               expired || ['error','stale'].includes(video.event));
      }
    } catch (_) {
      byId('recorder').textContent = '记录器未连接，请重新打开桌面上的「小车诊断记录」';
      byId('recorder').dataset.bad = true;
    } finally {
      setTimeout(refresh, 1000);
    }
  }
  function submit(form, input, hint, route, field, message) {
    byId(form).addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.submitter;
      button.disabled = true;
      try {
        const response = await fetch(route, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({[field]:byId(input).value})
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error);
        }
        byId(hint).textContent = message;
        if (field === 'note') byId(input).value = '';
      } catch (error) {
        byId(hint).textContent = error.message || '保存失败';
      } finally {
        button.disabled = false;
      }
    });
  }
  submit('cameraForm','cameraHost','cameraNote','/api/camera','host','地址已保存');
  submit('markForm','mark','markNote','/api/mark','note','已记录这个时刻');
  refresh();
</script>
</html>
